<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de producto - Mi Tienda</title>
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

<div id="encabezado"></div>

<div class="layout-admin contenedor">

  <nav class="admin-sidebar" aria-label="Menú de administración">
    <h2>Administración</h2>
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="productos.html" class="activo">Productos</a></li>
      <li><a href="categorias.html">Categorías</a></li>
      <li><a href="pedidos.html">Pedidos</a></li>
      <li><a href="../index.html">← Ir a la tienda</a></li>
    </ul>
  </nav>

  <main class="admin-contenido">
    <!-- El título cambia según sea nuevo o edición (lo cambia JS) -->
    <h1 id="titulo-formulario">Nuevo producto</h1>

    <form class="formulario" id="form-producto" novalidate>

      <div class="campo">
        <label for="input-nombre">Nombre del producto</label>
        <input type="text" id="input-nombre" name="nombre" placeholder="Ej: Teclado mecánico" required>
      </div>

      <div class="campo">
        <label for="input-descripcion">Descripción</label>
        <textarea id="input-descripcion" name="descripcion" rows="3" placeholder="Descripción del producto"></textarea>
      </div>

      <div class="campo">
        <label for="input-precio">Precio ($)</label>
        <input type="number" id="input-precio" name="precio" placeholder="0.00" min="0" step="0.01" required>
      </div>

      <div class="campo">
        <label for="input-stock">Stock (unidades)</label>
        <input type="number" id="input-stock" name="stock" placeholder="0" min="0" required>
      </div>

      <div class="campo">
        <label for="input-imagen">Imagen (URL o nombre de archivo en Assets/)</label>
        <input type="text" id="input-imagen" name="imagen" placeholder="Ej: teclado.jpg">
      </div>

      <div class="campo">
        <label for="select-categoria">Categoría</label>
        <select id="select-categoria" name="categoria_id" required>
          <option value="">Selecciona una categoría</option>
        </select>
      </div>

      <div id="mensaje-form" role="alert"></div>

      <div class="botones-form">
        <button type="submit" class="btn btn-primario" id="btn-guardar">Guardar</button>
        <a href="productos.html" class="btn btn-secundario">Cancelar</a>
      </div>

    </form>
  </main>

</div>

<script src="../js/configuracion.js" defer></script>
<script src="../js/api.js" defer></script>
<script src="../js/comun.js" defer></script>
<script src="../js/admin-producto-formulario.js" defer></script>
</body>
</html>
