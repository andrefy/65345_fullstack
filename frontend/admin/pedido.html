<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del pedido (admin) - Mi Tienda</title>
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

<div id="encabezado"></div>

<div class="layout-admin contenedor">

  <nav class="admin-sidebar" aria-label="Menú de administración">
    <h2>Administración</h2>
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="productos.html">Productos</a></li>
      <li><a href="categorias.html">Categorías</a></li>
      <li><a href="pedidos.html" class="activo">Pedidos</a></li>
      <li><a href="../index.html">← Ir a la tienda</a></li>
    </ul>
  </nav>

  <main class="admin-contenido">

    <nav class="breadcrumb" aria-label="Ruta de navegación">
      <a href="pedidos.html">Pedidos</a> &rsaquo;
      <span>Detalle</span>
    </nav>

    <div id="detalle-pedido-admin">
      <p class="cargando">Cargando pedido…</p>
    </div>

    <!-- Cambio de estado del pedido -->
    <div id="seccion-estado" class="tarjeta" hidden>
      <h2>Cambiar estado</h2>
      <form id="form-estado">
        <div class="campo">
          <label for="select-estado">Estado</label>
          <select id="select-estado" name="estado">
            <option value="pendiente">Pendiente</option>
            <option value="procesando">Procesando</option>
            <option value="enviado">Enviado</option>
            <option value="entregado">Entregado</option>
          </select>
        </div>
        <div id="mensaje-estado" role="status" aria-live="polite"></div>
        <button type="submit" class="btn btn-primario btn-sm">Actualizar estado</button>
      </form>
    </div>

  </main>

</div>

<script src="../js/configuracion.js" defer></script>
<script src="../js/api.js" defer></script>
<script src="../js/comun.js" defer></script>
<script src="../js/admin-pedido.js" defer></script>
</body>
</html>
