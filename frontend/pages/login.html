<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Mi Tienda</title>
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
  <div id="encabezado"></div>

  <main class="contenedor">
    <section class="tarjeta-auth">
      <h1 id="titulo">Iniciar sesión</h1>

      <!-- El mismo formulario sirve para entrar o crear una cuenta. -->
      <form class="formulario" id="form-acceso">
        <div class="campo">
          <label for="usuario">Usuario</label>
          <input id="usuario" name="username" required autocomplete="username">
        </div>
        <div class="campo" id="campo-correo" hidden>
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" name="email" autocomplete="email" disabled>
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <div class="campo" id="campo-confirmar" hidden>
          <label for="confirmar">Confirmar contraseña</label>
          <input type="password" id="confirmar" autocomplete="new-password" disabled>
        </div>
        <div id="mensaje-acceso" role="status"></div>
        <button class="btn btn-primario" id="btn-enviar">Entrar</button>
      </form>

      <p class="auth-pie">
        <button type="button" class="btn-enlace" id="btn-cambiar">Crear una cuenta</button>
      </p>
    </section>
  </main>

  <script src="../js/configuracion.js" defer></script>
  <script src="../js/api.js" defer></script>
  <script src="../js/comun.js" defer></script>
  <script src="../js/login.js" defer></script>
</body>
</html>
